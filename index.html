<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather API Viewer</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 1rem;
        background-color: #f4f4f9;
        color: #333;
      }
      h1 {
        text-align: center;
        color: #444;
      }
      .search-container {
        text-align: center;
        margin-bottom: 2rem;
      }
      input[type="text"] {
        padding: 0.8rem;
        width: 60%;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
      }
      button {
        padding: 0.8rem 1.5rem;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      .weather-card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .section-title {
        font-size: 1.2rem;
        font-weight: bold;
        border-bottom: 2px solid #eee;
        padding-bottom: 0.5rem;
        margin-top: 1.5rem;
        margin-bottom: 1rem;
        color: #555;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }
      .data-item {
        background: #f9f9f9;
        padding: 0.8rem;
        border-radius: 4px;
        border: 1px solid #eee;
      }
      .label {
        font-weight: bold;
        display: block;
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 0.3rem;
      }
      .value {
        font-size: 1.1rem;
        color: #222;
      }
      .error {
        color: red;
        text-align: center;
        margin-top: 1rem;
      }
      .empty-state {
        text-align: center;
        color: #777;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Weather Dashboard</h1>

    <div class="search-container">
      <form action="/" method="GET">
        <input
          type="text"
          name="city"
          placeholder="Enter city name (e.g., Kurnool)"
          value="{{CITY_VALUE}}"
          required
        />
        <button type="submit">Get Weather</button>
      </form>
    </div>

    <div class="weather-container">{{DATA}}</div>
  </body>
</html>
